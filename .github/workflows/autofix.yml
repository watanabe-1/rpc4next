name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    uses: watanabe-1/github-actions-common/.github/workflows/autofix.yml@c24a1f966b3d2d20ca30379e5a27ed137bfe760f # v1.0.2
    permissions:
      contents: write
      pull-requests: write
    with:
      fix-command: bun run check:fix
