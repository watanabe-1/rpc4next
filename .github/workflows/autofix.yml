name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    uses: watanabe-1/github-actions-common/.github/workflows/autofix.yml@202f337fb19a680cf6ec2180192ec43460a4bd18 # v1.2.1
    permissions:
      contents: write
      pull-requests: write
    with:
      fix-command: bun run check:fix
      update-actions-lock: true
      bun-install-mode: ${{ (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'release-please--')) && 'update' || 'auto' }}
