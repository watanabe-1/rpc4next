name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    uses: watanabe-1/github-actions-common/.github/workflows/autofix.yml@25793bf94b62c4948ce9742c8da78de3865822c9 # v1.1.0
    permissions:
      contents: write
      pull-requests: write
    with:
      fix-command: bun run check:fix
      bun-install-mode: ${{ (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'release-please--')) && 'update' || 'auto' }}
