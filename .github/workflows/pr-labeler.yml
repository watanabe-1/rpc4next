name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  label:
    uses: watanabe-1/github-actions-common/.github/workflows/pr-labeler.yml@0e9b6763a2f343233b82faed14089cf328d8f4b3 # v1.2.5
    permissions:
      contents: read
      pull-requests: write
