name: Renovate auto approve

on:
  # pull_request_target is required so Renovate PR approval can be submitted with
  # repository permissions. The called workflow only uses PR metadata and checks
  # the bot login, bot type, same repository, default branch, head branch prefix,
  # required label, and draft state before approving.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled

permissions: {}

jobs:
  approve:
    uses: watanabe-1/github-actions-common/.github/workflows/renovate-auto-approve.yml@25793bf94b62c4948ce9742c8da78de3865822c9 # v1.1.0
    permissions:
      pull-requests: write
