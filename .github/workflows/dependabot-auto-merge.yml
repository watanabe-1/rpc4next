name: Dependabot auto merge

on:
  # pull_request_target is required to read Dependabot metadata, approve the PR,
  # and enable auto-merge with repository permissions. The called workflow only
  # uses PR metadata and checks the bot login, bot type, same repository,
  # default branch, and draft state before mutating the PR.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  auto-merge:
    uses: watanabe-1/github-actions-common/.github/workflows/dependabot-auto-merge.yml@25793bf94b62c4948ce9742c8da78de3865822c9 # v1.1.0
    permissions:
      contents: write
      pull-requests: write
