name: Bun test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-test:
    name: CLI on Bun (${{ matrix.os }}, bun=${{ matrix.bun-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # needed for actions/checkout
    strategy:
      matrix:
        os: [ubuntu-latest]
        bun-version: ["1.1.0", "1.2.0", "aqua"]
        include:
          - os: windows-latest
            bun-version: aqua
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup build toolchain
        uses: watanabe-1/github-actions-common/actions/setup-toolchain@v1.1.0
        with:
          bun-version: aqua
          bun-cache: "true"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Select Bun runtime
        if: matrix.bun-version != 'aqua'
        uses: watanabe-1/github-actions-common/actions/setup-toolchain@v1.1.0
        with:
          bun-version: ${{ matrix.bun-version }}
      - name: Test built CLI on Bun
        run: bun test bun-tests/cli.test.ts

  status-check:
    name: Bun test status check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - bun-test
    steps:
      - name: Check required job result
        env:
          BUN_TEST_RESULT: ${{ needs.bun-test.result }}
        run: |
          if [ "$BUN_TEST_RESULT" = "success" ]; then
            exit 0
          fi
          echo "bun-test result: $BUN_TEST_RESULT"
          exit 1
