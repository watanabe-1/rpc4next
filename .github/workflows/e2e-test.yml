name: E2E test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-test:
    name: E2E test matrix (${{ matrix.os }}, bun=aqua, next=${{ matrix.next-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read # needed for actions/checkout
    strategy:
      matrix:
        os: [ubuntu-latest]
        next-version: ["15.0.0", "from-package"]
        include:
          - os: windows-latest
            next-version: from-package

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: watanabe-1/github-actions-common/actions/setup-toolchain@v1.2.6
        with:
          bun-version: aqua
          bun-cache: "true"

      - name: Install base dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Install target Next.js version
        shell: bash
        env:
          NEXT_VERSION: ${{ matrix.next-version }}
        run: |
          if [ "$NEXT_VERSION" = "from-package" ]; then
            echo "Using next from package.json"
          else
            echo "Overwriting package.json to use next@$NEXT_VERSION"
            rm -f bun.lockb bun.lock
            bun add "next@$NEXT_VERSION"
          fi

      # Next.js 15.0.0 cannot use the repository's TypeScript 7 dependency.
      # Remove this block when Next.js 15.0.0 is no longer in the support matrix.
      - name: Install TypeScript for Next.js 15
        if: matrix.next-version == '15.0.0'
        shell: bash
        run: |
          rm -f bun.lockb bun.lock
          bun add --cwd integration/next-app --dev "typescript@6.0.3"

      - name: Install Playwright browser dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Playwright's dry run simulates apt installation and reports missing packages.
          sudo apt-get update
          set +e
          dependencies=$(bun --bun --cwd integration/next-app playwright install-deps --dry-run chromium)
          status=$?
          set -e
          printf '%s\n' "$dependencies"
          if [ "$status" -eq 0 ]; then
            [ "$dependencies" = "All system dependencies are installed." ] || exit 1
          elif [ "$status" -eq 1 ]; then
            mapfile -t lines <<< "$dependencies"
            [[ ${lines[0]} =~ ^Missing\ system\ dependencies\ \(([0-9]+)\):$ ]] || exit 1
            count=${BASH_REMATCH[1]}
            packages=()
            for line in "${lines[@]:1}"; do
              [[ $line =~ ^\ \ ([a-z0-9][a-z0-9.+:-]*)$ ]] || exit 1
              packages+=("${BASH_REMATCH[1]}")
            done
            [ "${#packages[@]}" -eq "$count" ] && [ "$count" -gt 0 ] || exit 1

            echo "APT sources (runner default; no mirror switching):"
            apt-cache policy | grep -E 'https?://' || true
            for attempt in 1 2 3; do
              start=$SECONDS
              echo "Download attempt $attempt/3 started at $(date -u +%FT%TZ)"
              # timeout runs apt and its children in a process group; only downloads
              # are interrupted, never dpkg. APT retains completed archives.
              if sudo timeout --kill-after=10s 90s apt-get install -y --no-install-recommends --download-only "${packages[@]}"; then
                status=0
              else
                status=$?
              fi
              echo "Download attempt $attempt/3 ended at $(date -u +%FT%TZ) after $((SECONDS - start))s (exit $status)"
              if [ "$status" -eq 0 ]; then
                break
              elif [ "$status" -ne 124 ]; then
                echo "APT failed without a timeout; not retrying."
                exit "$status"
              elif [ "$attempt" -eq 3 ]; then
                echo "Download timed out on all three attempts."
                exit 1
              fi
              echo "Download timed out; retrying the same mirrors in 5 seconds."
              sleep 5
            done
            # Fail rather than fetch anything not already in the apt archive cache.
            sudo apt-get install -y --no-install-recommends --no-download "${packages[@]}"
          else
            echo "Playwright dependency check failed (exit $status)."
            exit "$status"
          fi
          bun --bun --cwd integration/next-app playwright install-deps --dry-run chromium
          echo "Playwright OS dependencies installed successfully."
          bun --bun --cwd integration/next-app playwright install chromium
          echo "Chromium installed successfully."

      - name: Install Playwright browser (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bun --bun --cwd integration/next-app playwright install chromium

      - name: Print versions
        shell: bash
        run: |
          uname -a || ver
          node -v
          bun -v
          bun --bun next --version
          bun --bun --cwd integration/next-app tsc --version

      - name: Build (all packages)
        shell: bash
        run: bun run build

      - name: Run integration e2e
        shell: bash
        run: bun run integration:next-app:e2e

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}-bun-aqua-next-${{ matrix.next-version }}
          path: |
            integration/next-app/playwright-report
            integration/next-app/playwright-report-base-path
          if-no-files-found: ignore
          retention-days: 7

  status-check:
    name: E2E test status check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - e2e-test
    steps:
      - name: Check required job result
        env:
          E2E_TEST_RESULT: ${{ needs.e2e-test.result }}
        run: |
          if [ "$E2E_TEST_RESULT" = "success" ]; then
            exit 0
          fi
          echo "e2e-test result: $E2E_TEST_RESULT"
          exit 1
