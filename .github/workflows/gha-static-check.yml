name: GHA static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gha-static-check:
    uses: watanabe-1/github-actions-common/.github/workflows/gha-static-check.yml@v1 # zizmor: ignore[unpinned-uses] Intentionally testing the v1 release tag.
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
    with:
      actionlint-self-action-path: "$/.github/actions/setup-toolchain"
