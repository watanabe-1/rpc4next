name: GHA static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-lockfile:
    name: Verify Actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify locked dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  gha-static-check:
    name: GHA static checks status check
    uses: watanabe-1/github-actions-common/.github/workflows/gha-static-check.yml@25793bf94b62c4948ce9742c8da78de3865822c9 # v1.1.0
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
