version: 2
updates:
  # --- Bun workspaces (shared root lockfile) ---
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    versioning-strategy: increase
    groups:
      bun:
        patterns:
          - "*"

  # --- GitHub Actions (root only) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
