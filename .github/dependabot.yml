version: 2
updates:
  # --- root ---
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    versioning-strategy: increase
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      bun:
        patterns:
          - "*"

  # --- packages/rpc4next ---
  - package-ecosystem: "bun"
    directory: "/packages/rpc4next"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    versioning-strategy: increase
    groups:
      bun:
        patterns:
          - "*"
    commit-message:
      prefix: "fix"
      include: "scope"

  # --- packages/rpc4next-cli ---
  - package-ecosystem: "bun"
    directory: "/packages/rpc4next-cli"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    versioning-strategy: increase
    groups:
      bun:
        patterns:
          - "*"
    commit-message:
      prefix: "fix"
      include: "scope"

  # --- packages/rpc4next-shared ---
  - package-ecosystem: "bun"
    directory: "/packages/rpc4next-shared"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    versioning-strategy: increase
    groups:
      bun:
        patterns:
          - "*"
    commit-message:
      prefix: "fix"
      include: "scope"

  # --- GitHub Actions (root only) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
